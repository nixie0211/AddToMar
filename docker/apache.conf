<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    PassEnv DB_HOST DB_PORT DB_NAME DB_USER DB_PASS DB_SSL DB_SSL_CA APP_URL
    PassEnv ADDTOMAR_GOOGLE_CLIENT_ID ADDTOMAR_GOOGLE_CLIENT_SECRET
    PassEnv ADDTOMAR_SMTP_USER ADDTOMAR_SMTP_PASS
    PassEnv PAYMONGO_PUBLIC_KEY PAYMONGO_SECRET_KEY
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

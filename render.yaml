# Render Blueprint: web app + MySQL.
# Create a Blueprint from this file in the Render dashboard after the repo is on GitHub.
# Private MySQL + disks are not available on the free plan.

services:
  - type: web
    name: addtomar
    runtime: docker
    plan: free
    healthCheckPath: /health.php
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: CAPS
      - key: DB_SSL
        value: "1"
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: APP_URL
        sync: false
      - key: ADDTOMAR_GOOGLE_CLIENT_ID
        sync: false
      - key: ADDTOMAR_GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADDTOMAR_SMTP_USER
        sync: false
      - key: ADDTOMAR_SMTP_PASS
        sync: false
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false

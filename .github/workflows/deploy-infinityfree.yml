name: Deploy to InfinityFree

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload PHP app to InfinityFree htdocs
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.INFINITYFREE_FTP_HOST }}
          username: ${{ secrets.INFINITYFREE_FTP_USER }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/env.local.php
            **/env.production.php
            **/node_modules/**
            **/.cursor/**
            **/AddToMar1/**
            **/vercel-gateway/**
            **/scripts/copy-vercel-static.sh
            **/render.yaml
            **/Dockerfile
            **/.dockerignore
            **/gcash.png
            **/.DS_Store
            **/Thumbs.db

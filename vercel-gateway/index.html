<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AddToMar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3fbf9; color: #132f3f; }
    main { max-width: 36rem; padding: 2rem; }
    a { color: #0f7a72; }
  </style>
  <script>
    // Paste your Render URL after the web service is live, then redeploy on Vercel.
    const RENDER_URL = "";
    if (RENDER_URL) {
      location.replace(RENDER_URL.replace(/\/$/, "") + location.pathname + location.search + location.hash);
    }
  </script>
</head>
<body>
  <main>
    <h1>AddToMar</h1>
    <p>The app runs on Render (PHP + MySQL). After your Render service is live, put that URL in <code>vercel-gateway/index.html</code> as <code>RENDER_URL</code> and redeploy this Vercel project.</p>
  </main>
</body>
</html>

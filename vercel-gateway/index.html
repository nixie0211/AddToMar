<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AddToMar</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3fbf9; color: #132f3f; }
    main { max-width: 36rem; padding: 2rem; }
    a { color: #0f7a72; }
  </style>
  <script>
    const RENDER_URL = "https://addtomar.onrender.com";
    const aliases = {
      "/login": "/login.php",
      "/register": "/register.php",
      "/logout": "/logout.php"
    };
    let path = location.pathname.replace(/\/+$/, "") || "/";
    path = aliases[path] || path;
    location.replace(RENDER_URL.replace(/\/$/, "") + path + location.search + location.hash);
  </script>
</head>
<body>
  <main>
    <h1>AddToMar</h1>
    <p>Opening the live app… If you are not redirected, go to <a href="https://addtomar.onrender.com/login.php">https://addtomar.onrender.com/login.php</a>.</p>
  </main>
</body>
</html>
